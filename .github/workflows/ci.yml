name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        shell: bash
        run: go build ./...
      - name: Vet
        shell: bash
        run: go vet ./...
      - name: Test (pass gate — excludes known pre-existing failures)
        shell: bash
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v internal/dataset | grep -v internal/storage)
          go test "${pkgs[@]}"
      - name: Full test suite (informational — known failures are non-blocking)
        shell: bash
        continue-on-error: true
        run: go test ./...

  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: sudo bash scripts/smoke-linux.sh
          - os: macos-14
            command: bash scripts/smoke-macos.sh
          - os: macos-15-intel
            command: bash scripts/smoke-macos.sh
          - os: windows-latest
            command: powershell -ExecutionPolicy Bypass -File scripts/smoke-windows.ps1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run smoke test
        shell: bash
        run: ${{ matrix.command }}
