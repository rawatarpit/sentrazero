name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build+test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        shell: bash
        run: go build ./...
      - name: Vet
        shell: bash
        run: go vet ./...
      - name: Test (pass gate)
        shell: bash
        run: go test ./...

  smoke:
    name: smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: sudo bash scripts/smoke-linux.sh
          - os: ubuntu-24.04-arm
            command: sudo bash scripts/smoke-linux.sh
          - os: macos-14
            command: bash scripts/smoke-macos.sh
          - os: macos-15-intel
            command: bash scripts/smoke-macos.sh
          - os: windows-latest
            command: powershell -ExecutionPolicy Bypass -File scripts/smoke-windows.ps1
          - os: windows-11-arm
            command: powershell -ExecutionPolicy Bypass -File scripts/smoke-windows.ps1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run smoke test
        shell: bash
        run: ${{ matrix.command }}

  # Cross-compiles the four Linux arches that have no hosted runner.
  # vet is included for every arch here because local verification
  # confirmed `go vet ./...` passes cleanly on all four (GOOS=linux,
  # GOARCH=386/riscv64/ppc64le/s390x, CGO_ENABLED=0).
  cross-arch-verify:
    name: cross-arch verify (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: 386
          - goos: linux
            goarch: riscv64
          - goos: linux
            goarch: ppc64le
          - goos: linux
            goarch: s390x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile build (${{ matrix.goos }}/${{ matrix.goarch }})
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...
      - name: Cross-compile vet (${{ matrix.goos }}/${{ matrix.goarch }})
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go vet ./...
